aid: zorus
name: Zorus
description: >-
  Zorus is a cybersecurity company that provides DNS web protection and filtering
  built for managed service providers (MSPs), managed security service providers
  (MSSPs), and IT teams. Its Archon agent delivers DNS filtering without requiring
  per-router DNS changes, layered with CyberSight behavioral user analytics, geo-IP
  and network filtering, zero-trust device isolation, and SaaS inventory and usage
  visibility. Zorus is delivered as a multi-tenant SaaS platform administered through
  a partner portal (portal.zorustech.com), positioned as an alternative to Cisco
  Umbrella, WebRoot DNS, and WebTitan. Zorus does not currently publish a public
  developer API, OpenAPI specification, SDKs, or developer documentation; its API
  surface (api.zorustech.com) sits behind the authenticated product portal. This
  profile captures the company's public web properties and probed security posture.
